services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "${API_PORT}:8080"
    env_file:
      - .env
    networks:
      - app_net

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend_token.txt:/etc/prometheus/backend_token.txt
      - prometheus_data:/prometheus
    networks:
      - app_net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_net

volumes:
  grafana_data:
  prometheus_data:
  
networks:
  app_net:
    driver: bridge
